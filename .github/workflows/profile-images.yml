name: Profile images

# Rebuilds the contribution snake and the activity graph, then publishes them to the `output` branch.
on:
  schedule:
    - cron: "0 3 * * *" # daily, 06:00 MSK
  workflow_dispatch:
  push:
    branches: [main, readme-redesign] # TODO: drop readme-redesign before merging into main

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Runs first: snk works inside Docker as root, so a dist/ it creates is not writable afterwards.
      - name: Activity graph
        run: node .github/scripts/activity-graph.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0d9488&color_dots=#ebedf0,#ccfbf1,#5eead4,#14b8a6,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
