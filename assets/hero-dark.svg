<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Алексей Березиков — Software Engineer, от алгоритмов до продукта">
<style>
.s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
.tr{fill:none;stroke:#9aa3af;stroke-opacity:.45;stroke-width:1.5}
.p{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-linecap:round;stroke-dasharray:.14 1;stroke-dashoffset:1.14;animation:run 3.6s cubic-bezier(.4,0,.2,1) infinite}
.p2{animation-delay:1.2s}.p3{animation-delay:2.4s}
@keyframes run{to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.in{opacity:0;animation:in .8s ease-out .15s forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.p{display:none}.cur{animation:none}.in{opacity:1;animation:none}}
</style>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2937"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="mk"><rect width="840" height="300" fill="url(#fade)"/></mask>
<radialGradient id="glow" cx=".86" cy=".2" r=".55"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect x=".5" y=".5" width="839" height="299" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="300" fill="#0a0c10"/>
<rect width="840" height="300" fill="url(#g)" mask="url(#mk)"/>
<rect width="840" height="300" fill="url(#glow)"/>
<path class="tr" d="M840 58 H792 L772 78 V122 H756"/><path class="tr" d="M840 74 H800 L784 90 V138 H756"/><path class="tr" d="M840 250 H800 L780 230 V170 H756"/><path class="tr" d="M640 150 H676"/><path class="tr" d="M612 108 L640 136 V150"/><path class="tr" d="M600 214 L640 174 V150"/>
<path class="p" pathLength="1" d="M840 58 H792 L772 78 V122 H756"/><path class="p p2" pathLength="1" d="M640 150 H676"/><path class="p p3" pathLength="1" d="M840 250 H800 L780 230 V170 H756"/>
<circle cx="612" cy="108" r="5" fill="#0a0c10" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="600" cy="214" r="5" fill="#0a0c10" stroke="#2dd4bf" stroke-width="1.5"/>
<g>
<rect x="676" y="110" width="80" height="80" rx="8" fill="#12151c" stroke="#2dd4bf" stroke-width="1.5"/>
<circle cx="688" cy="122" r="2.5" fill="#2dd4bf"/>
<path class="tr" d="M668 126h8M756 126h8"/><path class="tr" d="M668 142h8M756 142h8"/><path class="tr" d="M668 158h8M756 158h8"/><path class="tr" d="M668 174h8M756 174h8"/>
<text x="716" y="157" text-anchor="middle" class="m" font-size="20" font-weight="700" fill="#2dd4bf">&lt;/&gt;</text>
</g>
</g>
<rect x=".5" y=".5" width="839" height="299" rx="16" fill="none" stroke="#1f2937"/>
<g class="in">
<path d="M48 56h36" stroke="#9aa3af" stroke-width="1.5"/>
<text x="96" y="61" class="m" font-size="15"><tspan fill="#2dd4bf" font-weight="700">00</tspan><tspan fill="#9aa3af"> / GitHub</tspan></text>
<text x="48" y="100" class="m" font-size="14" letter-spacing="2" fill="#2dd4bf">САНКТ-ПЕТЕРБУРГ, РОССИЯ</text>
<text x="46" y="156" class="s" font-size="50" font-weight="700" letter-spacing="-1" fill="#e8eaed">Алексей Березиков</text>
<text x="48" y="198" class="s" font-size="25" font-weight="600" fill="#e8eaed">Software Engineer<tspan class="cur" fill="#2dd4bf">_</tspan></text>
<text x="48" y="230" class="s" font-size="20" fill="#9aa3af">от алгоритмов до продукта</text>
<text x="48" y="268" class="m" font-size="14" fill="#9aa3af">СПбГУ · ПМ-ПУ · выпуск 2026</text>
